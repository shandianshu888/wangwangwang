<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">网络客户端配置流程图</title><desc id="desc">下载、导入订阅、选择节点、开启代理、检查结果五步流程</desc><rect width="1200" height="420" rx="28" fill="#fff8e8"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="600" y="58" font-size="28" font-weight="700" fill="#171514">旺仔五步配置流程</text><g fill="#ffd8e2" stroke="#171514" stroke-width="4"><rect x="55" y="135" width="190" height="150" rx="18"/><rect x="280" y="135" width="190" height="150" rx="18" fill="#fff0a8"/><rect x="505" y="135" width="190" height="150" rx="18" fill="#dcecff"/><rect x="730" y="135" width="190" height="150" rx="18" fill="#e0f4e7"/><rect x="955" y="135" width="190" height="150" rx="18" fill="#eadfff"/></g><g font-size="22" font-weight="700" fill="#171514"><text x="150" y="190">01 下载</text><text x="375" y="190">02 导入</text><text x="600" y="190">03 选节点</text><text x="825" y="190">04 开代理</text><text x="1050" y="190">05 检查</text></g><g font-size="16" fill="#4f4843"><text x="150" y="225">官方商店 / Releases</text><text x="375" y="225">粘贴订阅地址</text><text x="600" y="225">先选可用节点</text><text x="825" y="225">系统代理或 TUN</text><text x="1050" y="225">网页、DNS、日志</text></g><g stroke="#171514" stroke-width="4" fill="none"><path d="M250 210h25m-9-9 9 9-9 9M475 210h25m-9-9 9 9-9 9M700 210h25m-9-9 9 9-9 9M925 210h25m-9-9 9 9-9 9"/></g><text x="600" y="355" font-size="18" fill="#a42e4c">旺！一次只改一个开关，出问题才知道是哪一步。</text></g></svg>
